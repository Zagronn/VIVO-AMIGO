version: "1.0"
swarm_name: "VIVO_AMIGO_MASTER_SWARM"
orchestration:
  master_agent:
    id: "agent_master_01"
    model: "nvidia/nemotron-3.5-70b"
    capabilities: ["task_routing", "consensus_verification", "handoff_logging"]

  sub_agents:
    # 1. VERI-SHIELD Grubu (10 Ajan)
    - group: "VERI_SHIELD_COMPLIANCE"
      count: 10
      model: "meta-llama/llama-3.1-8b-instruct"
      roles: ["renap_verifier", "sat_fel_auditor", "fraud_detector", "kyc_checker"]

    # 2. VIVOAMIGOPAY Grubu (10 Ajan)
    - group: "PAY_VIVO_FINANCE"
      count: 10
      model: "meta-llama/llama-3.1-70b-instruct"
      roles: ["escrow_lock_manager", "ledger_auditor", "settlement_engine", "p2p_router"]

    # 3. CARGO VIVO Grubu (10 Ajan)
    - group: "CARGO_VIVO_LOGISTICS"
      count: 10
      model: "meta-llama/llama-3.1-8b-instruct"
      roles: ["route_optimizer", "shipment_tracker", "proof_of_delivery_verifier"]

    # 4. VIVO POS Grubu (5 Ajan)
    - group: "VIVO_POS_OPERATIONS"
      sub_agents:
        - group: "MARKETPLACE_SELLER_QUALITY"
          count: 25
          model: "meta-llama/llama-3.1-70b-instruct"
          task_keywords: ["SELLER", "LISTING", "CATALOG", "INVENTORY", "STOREFRONT"]
          roles: ["seller_journey_tester", "listing_publisher", "catalog_quality_reviewer", "inventory_workflow_tester", "seller_support_simulator"]
        - group: "MARKETPLACE_BUYER_JOURNEY"
          count: 25
          model: "meta-llama/llama-3.1-70b-instruct"
          task_keywords: ["BUYER", "SHOPPER", "CART", "CHECKOUT", "SEARCH", "FAVORITE"]
          roles: ["buyer_journey_tester", "search_relevance_reviewer", "cart_flow_tester", "checkout_guard_tester", "accessibility_reviewer"]
        - group: "MARKETPLACE_CATALOG_QA"
          count: 25
          model: "meta-llama/llama-3.1-8b-instruct"
          task_keywords: ["MARKETPLACE", "PRODUCT", "CATEGORY", "JOB", "PROPERTY", "AUTOMOTIVE"]
          roles: ["category_experience_tester", "product_detail_reviewer", "job_application_reviewer", "real_estate_flow_tester", "automotive_flow_tester"]
        - group: "CARGO_SHIPPER_EXPERIENCE"
          count: 25
          model: "meta-llama/llama-3.1-8b-instruct"
          task_keywords: ["CARGO", "SHIPPER", "SHIPMENT", "TRACKING", "PICKUP"]
          roles: ["shipper_journey_tester", "tracking_accuracy_reviewer", "pickup_flow_tester", "delivery_status_reviewer", "shipment_support_simulator"]
        - group: "CARGO_COURIER_OPERATIONS"
          count: 25
          model: "meta-llama/llama-3.1-8b-instruct"
          task_keywords: ["COURIER", "DRIVER", "ROUTE", "DELIVERY", "PROOF_OF_DELIVERY"]
          roles: ["courier_workflow_tester", "route_optimizer", "proof_of_delivery_reviewer", "driver_safety_reviewer", "exception_handler"]
        - group: "PAY_PAYER_EXPERIENCE"
          count: 25
          model: "meta-llama/llama-3.1-70b-instruct"
          task_keywords: ["PAY", "PAYER", "WALLET", "TRANSFER", "TOPUP", "BILL"]
          roles: ["payer_journey_tester", "wallet_flow_reviewer", "transfer_quote_reviewer", "topup_flow_tester", "payment_support_simulator"]
        - group: "PAY_MERCHANT_SETTLEMENT"
          count: 25
          model: "meta-llama/llama-3.1-70b-instruct"
          task_keywords: ["ESCROW", "LEDGER", "SETTLEMENT", "PAYOUT", "MERCHANT", "REFUND"]
          roles: ["merchant_settlement_tester", "escrow_gate_reviewer", "ledger_auditor", "payout_release_reviewer", "refund_workflow_tester"]
        - group: "TRUST_COMPLIANCE"
          count: 25
          model: "meta-llama/llama-3.1-8b-instruct"
          task_keywords: ["VERIFY", "KYC", "FRAUD", "RENAP", "SAT", "COMPLIANCE", "DISPUTE"]
          roles: ["kyc_checker", "fraud_detector", "identity_verifier", "compliance_auditor", "dispute_evidence_reviewer"]
        - group: "PLATFORM_RELIABILITY"
          count: 25
          model: "meta-llama/llama-3.1-8b-instruct"
          task_keywords: ["QA", "TEST", "API", "PERFORMANCE", "SECURITY", "RELIABILITY", "DEPLOY"]
