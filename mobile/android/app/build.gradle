plugins { id 'com.android.application' }

android {
    namespace 'com.vivoamigo.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vivoamigo.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        archivesBaseName = 'vivo-amigo'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Configure signing in ~/.gradle/gradle.properties or CI secrets.
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "vivo-amigo-${variant.name}-${defaultConfig.versionName}.apk" }
    }
}
