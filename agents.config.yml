version: "1.0"
swarm_name: "VIVO_AMIGO_MASTER_SWARM"
orchestration:
  autonomy:
    enabled: true
    mode: "autonomous"
    master_agent: "agent_master_01"
    privileged_sub_agent: "verishield_01"
    allowed_actions: ["run_tests", "inspect_logs", "run_health_checks", "commit_build_artifacts"]
    external_operations: "require_credentials"
  master_agent:
    id: "agent_master_01"
    model: "nvidia/nemotron-3.5-70b"
    capabilities: ["task_routing", "consensus_verification", "handoff_logging"]

  sub_agents:
    - group: "MARKETPLACE_SELLER_QUALITY"
      count: 25
      model: "meta-llama/llama-3.1-70b-instruct"
      task_keywords: ["SELLER", "LISTING", "CATALOG", "INVENTORY", "STOREFRONT"]
      roles: ["seller_journey_tester", "listing_publisher", "catalog_quality_reviewer", "inventory_workflow_tester", "seller_support_simulator"]
    - group: "MARKETPLACE_BUYER_JOURNEY"
      count: 25
      model: "meta-llama/llama-3.1-70b-instruct"
      task_keywords: ["BUYER", "SHOPPER", "CART", "CHECKOUT", "SEARCH", "FAVORITE"]
      roles: ["buyer_journey_tester", "search_relevance_reviewer", "cart_flow_tester", "checkout_guard_tester", "accessibility_reviewer"]
    - group: "MARKETPLACE_CATALOG_QA"
      count: 25
      model: "meta-llama/llama-3.1-8b-instruct"
      task_keywords: ["MARKETPLACE", "PRODUCT", "CATEGORY", "JOB", "PROPERTY", "AUTOMOTIVE"]
      roles: ["category_experience_tester", "product_detail_reviewer", "job_application_reviewer", "real_estate_flow_tester", "automotive_flow_tester"]
    - group: "CARGO_SHIPPER_EXPERIENCE"
      count: 25
      model: "meta-llama/llama-3.1-8b-instruct"
      task_keywords: ["CARGO", "SHIPPER", "SHIPMENT", "TRACKING", "PICKUP"]
      roles: ["shipper_journey_tester", "tracking_accuracy_reviewer", "pickup_flow_tester", "delivery_status_reviewer", "shipment_support_simulator"]
    - group: "CARGO_COURIER_OPERATIONS"
