name = "vivo-amigo-edge"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "LISTINGS_KV"
id = "replace-with-listings-kv-id"

[[d1_databases]]
binding = "DB"
database_name = "vivo-amigo-production"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "VOICE_NOTES_BUCKET"
bucket_name = "vivo-amigo-voice-notes"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "vivo-amigo-listings"

[observability]
enabled = true
