# VIVO AMIGO production edge. Mount with TLS certificates and resolve upstreams on the private network.
upstream vivo_pos { server pos-api:3002; }
upstream veri_shield { server compliance-api:3001; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name vivoamigo.com www.vivoamigo.com payvivoamigo.com www.payvivoamigo.com cargovivo.com www.cargovivo.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name vivoamigo.com www.vivoamigo.com;
  ssl_certificate /etc/letsencrypt/live/vivoamigo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vivoamigo.com/privkey.pem;
  include /etc/nginx/snippets/vivo-tls.conf;
  location / { proxy_pass http://vivo_pos; include /etc/nginx/snippets/vivo-proxy.conf; }
  location /v1/compliance/ { proxy_pass http://veri_shield; include /etc/nginx/snippets/vivo-proxy.conf; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name payvivoamigo.com www.payvivoamigo.com;
  ssl_certificate /etc/letsencrypt/live/payvivoamigo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/payvivoamigo.com/privkey.pem;
  include /etc/nginx/snippets/vivo-tls.conf;
  location / { proxy_pass http://vivo_pos; include /etc/nginx/snippets/vivo-proxy.conf; }
  location /v1/compliance/ { proxy_pass http://veri_shield; include /etc/nginx/snippets/vivo-proxy.conf; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cargovivo.com www.cargovivo.com;
  ssl_certificate /etc/letsencrypt/live/cargovivo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cargovivo.com/privkey.pem;
  include /etc/nginx/snippets/vivo-tls.conf;
  location / { proxy_pass http://vivo_pos; include /etc/nginx/snippets/vivo-proxy.conf; }
  location /v1/cargo/ { proxy_pass http://veri_shield; include /etc/nginx/snippets/vivo-proxy.conf; }
}
